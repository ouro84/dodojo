name: CI

on:
  push:
    branches: [main]
    # PR/push purement documentaires : pas de CI (aucun code touché).
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

# Annule les runs obsolètes quand on repousse sur la même branche/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vars publiques Supabase requises au build ET par les clients (lib/supabase/*).
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_KEY_SUPABASE: ${{ secrets.NEXT_PUBLIC_KEY_SUPABASE }}

jobs:
  checks:
    name: Lint · Vitest · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build Next.js
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Inutile de lancer les e2e si le build/les tests unitaires échouent déjà.
    needs: checks
    env:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_ONBOARDING_EMAIL: ${{ secrets.E2E_ONBOARDING_EMAIL }}
      E2E_ONBOARDING_PASSWORD: ${{ secrets.E2E_ONBOARDING_PASSWORD }}
      NEXT_PRIVATE_KEY_SUPABASE: ${{ secrets.NEXT_PRIVATE_KEY_SUPABASE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright (chromium + deps système)
        run: npx playwright install --with-deps chromium

      - name: Tests e2e (Playwright)
        # webServer (playwright.config.ts) lance `npm run dev` ; CI=true force
        # reuseExistingServer=false et active les retries.
        run: npm run e2e

      - name: Upload rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

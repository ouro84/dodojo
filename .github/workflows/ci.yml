name: CI

on:
  # Pas de trigger push:main — redondant avec pull_request (déjà vérifié avant merge).
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

# Annule les runs obsolètes quand on repousse sur la même branche/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vars publiques Supabase requises au build ET par les clients (lib/supabase/*).
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_KEY_SUPABASE: ${{ secrets.NEXT_PUBLIC_KEY_SUPABASE }}

jobs:
  checks:
    name: Lint · Vitest · Build
    runs-on: ubuntu-latest
    # Plafond de sécurité (défaut GitHub : 360 min). Ce job tourne en ~1 min ;
    # au-delà de 15 min quelque chose est bloqué, pas lent. Les crédits Actions
    # de ce repo ont déjà été épuisés une fois (cf. CLAUDE.md, refactor push
    # Inngest) — un job qui part en boucle ne doit pas pouvoir les consommer.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build Next.js
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Inutile de lancer les e2e si le build/les tests unitaires échouent déjà.
    needs: checks
    # Plafond de sécurité, même raison que le job `checks`. La suite tourne en
    # 15-19 min en CI ; 45 min laissent la marge des 2 retries et du plafond de
    # démarrage du webServer (600 s, cf. playwright.config.ts) sans laisser un
    # run bloqué courir 6 h.
    timeout-minutes: 45
    env:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      # Isolation multi-comptes (4 workers en CI, cf. playwright.config.ts) :
      # un compte Supabase dédié par worker, sinon ils se marchent dessus sur
      # le même état en parallèle (cf. e2e/fixtures.ts).
      E2E_TEST_EMAIL_2: ${{ secrets.E2E_TEST_EMAIL_2 }}
      E2E_TEST_PASSWORD_2: ${{ secrets.E2E_TEST_PASSWORD_2 }}
      E2E_TEST_EMAIL_3: ${{ secrets.E2E_TEST_EMAIL_3 }}
      E2E_TEST_PASSWORD_3: ${{ secrets.E2E_TEST_PASSWORD_3 }}
      E2E_TEST_EMAIL_4: ${{ secrets.E2E_TEST_EMAIL_4 }}
      E2E_TEST_PASSWORD_4: ${{ secrets.E2E_TEST_PASSWORD_4 }}
      E2E_ONBOARDING_EMAIL: ${{ secrets.E2E_ONBOARDING_EMAIL }}
      E2E_ONBOARDING_PASSWORD: ${{ secrets.E2E_ONBOARDING_PASSWORD }}
      NEXT_PRIVATE_KEY_SUPABASE: ${{ secrets.NEXT_PRIVATE_KEY_SUPABASE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright (chromium + deps système)
        run: npx playwright install --with-deps chromium

      - name: Tests e2e (Playwright)
        # webServer (playwright.config.ts) lance un serveur de PRODUCTION
        # (`npm run build && npm run start`), pas `npm run dev` — ce commentaire
        # disait l'inverse, alors que la config impose le mode prod depuis
        # longtemps (routes précompilées, sinon la 1re navigation compile à la
        # demande et dépasse le timeout). Mesuré : ~29 s en CI pour
        # prebuild + build + start + globalSetup.
        # CI=true force reuseExistingServer=false, active les 2 retries et
        # applique les timeouts CI (`timeout` par test et `expect.timeout`).
        run: npm run e2e

      - name: Upload rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

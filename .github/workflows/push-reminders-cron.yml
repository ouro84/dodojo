name: Push reminders cron

# US-11 : déclenche /api/cron/push-reminders toutes les ~15 min (approxime
# la fenêtre 17h30 heure locale pour tous les fuseaux, cf.
# docs/superpowers/specs/2026-07-22-us11-push-design.md). Remplace un Cron
# Vercel natif, incompatible avec le palier Hobby (1 exécution/jour max,
# voir CLAUDE.md). L'idempotence (profiles.last_reminder_sent_on) absorbe
# le jitter connu des schedules GitHub Actions.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la route de rappel push
        run: |
          curl -sf -X GET "https://dodojo.vercel.app/api/cron/push-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

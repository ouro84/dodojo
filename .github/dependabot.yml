version: 2
updates:
  # Dépendances npm (package.json / package-lock.json)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Regroupe les bumps mineurs/patch en une seule PR pour limiter le bruit.
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Actions utilisées dans les workflows GitHub (.github/workflows/*)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
